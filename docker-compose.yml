version: "3.9"

services:
  # ─── MySQL 8.0 ───────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: crisislink_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-crisislink_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crisislink_db}
      MYSQL_USER: ${MYSQL_USER:-crisislink_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crisislink_pass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/02_sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql
      - ./database/migrations/03_views_triggers.sql:/docker-entrypoint-initdb.d/03_views_triggers.sql
      - ./database/migrations/04_procedures_functions.sql:/docker-entrypoint-initdb.d/04_procedures_functions.sql
      - ./database/migrations/05_indexes_security.sql:/docker-entrypoint-initdb.d/05_indexes_security.sql
    networks:
      - crisislink_net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-crisislink_root}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── MongoDB ─────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: crisislink_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-crisislink_mongo}
      MONGO_INITDB_DATABASE: crisislink_nosql
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - crisislink_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Neo4j ───────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.15
    container_name: crisislink_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-crisislink_neo4j}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - crisislink_net
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ─── ChromaDB ────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.3
    container_name: crisislink_chroma
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - ANONYMIZED_TELEMETRY=False
      - ALLOW_RESET=TRUE
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - crisislink_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Flask Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crisislink_backend
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-crisislink_secret_key_change_in_production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-crisislink_jwt_secret_change_in_production}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-crisislink_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crisislink_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crisislink_db}
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-crisislink_mongo}@mongodb:27017/crisislink_nosql?authSource=admin
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-crisislink_neo4j}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - chroma_embeddings:/app/embeddings_cache
    networks:
      - crisislink_net
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  # ─── Next.js Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crisislink_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - crisislink_net
    depends_on:
      - backend

volumes:
  mysql_data:
  mongo_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:
  chroma_embeddings:

networks:
  crisislink_net:
    driver: bridge
